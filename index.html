<!DOCTYPE html>
<html>
<head>
  <title>Button with Image Background</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    #myButton {
      width: 250px;
      height: 120px;
      background-image: url('https://github.com/MANALTREND/Button_image/blob/main/Gemini_Generated_Image_tx8ymhtx8ymhtx8y.png?raw=true'); /* <-- Replace with your image URL */
      background-size: cover;
      background-position: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    #myButton:hover {
      transform: scale(1.05);
      transition: 0.3s;
    }
  </style>
</head>
<body>

<button id="myButton">Click Me</button>

</body>
</html>
